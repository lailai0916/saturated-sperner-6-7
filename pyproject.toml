[project]
name = "ai-math-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hypothesis>=6.156.7",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "sympy>=1.14.0",
    "z3-solver<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
files = [
    "scripts/p0053_sat7.py",
    "scripts/p0054_layered_sat7.py",
    "scripts/p0054_size54_discovery.py",
    "scripts/p0054_size54_profile_search.py",
    "scripts/p0054_size54_structural.py",
    "scripts/p0054_size54_system_search.py",
    "scripts/p0054_verify_candidate.py",
    "scripts/p0054_verify_drat.py",
    "tests",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
